# v로 시작하는 태그(예: v1.0.0)를 올리면 Windows·Mac 실행 파일을 만들어 Releases에 올린다.
# 결과물: 저장소 › Releases (로그인 없이 누구나 받을 수 있음)
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            args: --win portable -c.win.artifactName=Ling-AI-Presenter-Windows.exe
            files: dist/*.exe
          - os: macos-latest
            args: --mac zip --arm64 --x64 -c.mac.artifactName='Ling-AI-Presenter-Mac-${arch}.zip'
            files: dist/*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 서명 인증서가 없으므로 Mac은 ad-hoc 서명만 한다 (처음 열 때 사용가이드의 Mac 안내 참고)
      - run: npx electron-builder ${{ matrix.args }} --publish never
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: softprops/action-gh-release@v2
        with:
          name: Ling AI Presenter ${{ github.ref_name }}
          files: ${{ matrix.files }}
          body: |
            AI 아바타가 Ling의 포트폴리오를 1인칭으로 소개하고 질문에 답하는 앱입니다. 사용 방법은 저장소의 사용가이드.md를 봐 주세요.

            - **Windows**: `Ling-AI-Presenter-Windows.exe`를 받아 더블클릭 ("PC 보호" 창이 뜨면 추가 정보 › 실행)
            - **Mac (M1 이후)**: `Ling-AI-Presenter-Mac-arm64.zip` / **Mac (Intel)**: `Ling-AI-Presenter-Mac-x64.zip` → 압축을 풀고 Finder에서 우클릭 › 열기
            - 소개 발표는 API 키 없이 바로 재생됩니다. 질의응답에는 Gemini API 키가 필요합니다.
